[project]
name = "uDocket"
version = "0.1.0"
description = "Legal interview/consultation analysis and documentation tool."
readme = "README.md"
requires-python = ">=3.12"
# Root workspace should have NO runtime dependencies
# All runtime dependencies should be declared in individual packages/apps
dependencies = []

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "apps/web",
    "packages/py-domain",
    "packages/py-ai-core",
    "packages/py-worker-core",
]

[tool.uv]
# Development dependencies for the entire workspace
# These are available to all packages but not installed in production
dev-dependencies = [
    # Package management
    "uv>=0.5.21,<0.6.0",

    # Testing
    "pytest>=8.4.2,<9.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-benchmark>=5.2.3,<6.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "hypothesis>=6.148.1,<7.0.0",

    # Type checking
    "mypy>=1.18.2,<2.0.0",
    "pyright>=1.1.407,<2.0.0",

    # Linting and formatting
    "ruff>=0.14.3,<0.15.0",
    "pylint>=4.0.3,<5.0.0",
    "prettier>=0.0.7,<0.1.0",

    # Security
    "bandit>=1.9.1,<2.0.0",
    "safety>=3.7.0,<4.0.0",

    # Git and versioning
    "pre-commit>=4.4.0,<5.0.0",
    "commitizen>=4.10.0,<5.0.0",
    "semantic-release>=0.1.0,<0.2.0",

    # Build and automation
    "doit>=0.36.0,<0.37.0",
]

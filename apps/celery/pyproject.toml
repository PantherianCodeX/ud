[project]
name = "udocket-celery"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Task queue
    "celery>=5.5.3,<6.0.0",

    # Workspace packages
    "udocket-domain",
    "udocket-worker-core",
]

[tool.uv]
dev-dependencies = [
    # Dev dependencies inherited from root workspace
    # Package-specific dev deps can be added here if needed
]

[tool.uv.sources]
udocket-domain = { workspace = true }
udocket-worker-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/udocket_celery"]

[tool.hatch.build.targets.sdist]
include = ["src/udocket_celery"]

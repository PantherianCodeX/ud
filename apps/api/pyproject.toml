[project]
name = "udocket-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.121.3,<0.122.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "python-multipart>=0.0.20,<0.1.0",

    # Database
    "sqlalchemy>=2.0.44,<3.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "alembic>=1.17.2,<2.0.0",

    # Data models and validation
    "pydantic>=2.12.4,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",

    # Logging
    "structlog>=25.5.0,<26.0.0",

    # Authentication (roadmap)
    "pyjwt[crypto]>=2.10.1,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",

    # Workspace packages
    "udocket-domain",
    "udocket-ai-core",
]

[tool.uv]
dev-dependencies = [
    # Dev dependencies inherited from root workspace
    # Package-specific dev deps can be added here if needed
]

[tool.uv.sources]
udocket-domain = { workspace = true }
udocket-ai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/udocket_api"]

[tool.hatch.build.targets.sdist]
include = ["src/udocket_api"]

# Pre-commit hooks configuration for uDocket monorepo
# Install: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files
# Update hooks: uv run pre-commit autoupdate

repos:
  # Quality configuration validation
  - repo: local
    hooks:
      - id: check-quality-config
        name: Check quality configuration integrity
        entry: python tooling/check_quality_config.py
        language: system
        pass_filenames: false
        always_run: true

  # Dependency validation
  - repo: local
    hooks:
      - id: check-dependencies
        name: Check dependency configuration
        entry: python tooling/check_dependencies.py
        language: system
        pass_filenames: false
        files: 'pyproject\.toml$'
        always_run: false

  # Ruff - Primary Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run linter
      - id: ruff
        args: [--config=configs/ruff.toml, --fix]
        types_or: [python, pyi]
        exclude: &exclude_prp ^(\.claude|PRPs)/
      # Run formatter
      - id: ruff-format
        args: [--config=configs/ruff.toml]
        types_or: [python, pyi]
        exclude: *exclude_prp

  # Pylint - Secondary static analysis
  - repo: local
    hooks:
      - id: pylint
        name: Pylint
        entry: uv run pylint
        language: system
        types: [python]
        args:
          - --rcfile=configs/pylint.toml
          - --score=no
        exclude: '^(\.venv|venv|\.git|__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache|build|dist|\.claude|PRPs)/'

  # Mypy - Type checking
  - repo: local
    hooks:
      - id: mypy
        name: Mypy type checker
        entry: uv run mypy
        language: system
        types: [python]
        args: [--config-file=configs/pyproject.toml]
        exclude: '^(\.venv|venv|\.git|__pycache__|tests?/|\.claude|PRPs)/'
        require_serial: true

  # Pyright - Additional type checking
  - repo: local
    hooks:
      - id: pyright
        name: Pyright type checker
        entry: uv run pyright
        language: system
        types: [python]
        exclude: '^(\.venv|venv|\.git|__pycache__|tests?/|\.claude|PRPs)/'
        require_serial: true
        pass_filenames: false

  # Security scanning
  - repo: local
    hooks:
      - id: bandit
        name: Bandit security scanner
        entry: uv run bandit
        language: system
        types: [python]
        args:
          - -c
          - configs/.bandit
          - -r
        exclude: '^(\.venv|venv|tests?/|\.claude|PRPs)/'

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        exclude: *exclude_prp

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(\.venv|venv|\.git|\.claude|PRPs)/'
      - id: end-of-file-fixer
        exclude: '^(\.venv|venv|\.git|\.claude|PRPs)/'
      - id: check-yaml
        exclude: '^(\.venv|venv|\.git|\.claude|PRPs)/'
      - id: check-toml
        exclude: '^(\.venv|venv|\.git|\.claude|PRPs)/'
      - id: check-json
        exclude: '^(\.venv|venv|\.git|\.claude|PRPs)/'
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
        exclude: *exclude_prp

  # Python-specific checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
        exclude: '^(\.venv|venv|\.claude|PRPs)/'
      - id: debug-statements
        exclude: '^(\.venv|venv|\.claude|PRPs)/'
      - id: check-docstring-first
        exclude: '^(\.venv|venv|\.claude|PRPs)/'

  # Prettier for TypeScript, JavaScript, JSON, YAML, Markdown
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [ts, tsx, javascript, jsx, json, yaml, markdown]
        exclude: '^(\.venv|venv|node_modules|\.git|package-lock\.json|pnpm-lock\.yaml|\.claude|PRPs)/'

# Global settings
default_language_version:
  python: python3.12

# Fail fast - stop running hooks after first failure
fail_fast: false

# Don't run on specific branches
exclude: '^\.git/'

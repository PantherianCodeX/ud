name: Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.21"
  IS_PROTECTED_BRANCH: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop')) }}

jobs:
  dependency-check:
    name: Dependency Configuration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check dependency configuration
        run: uv run python tooling/check_dependencies.py

  python-quality:
    name: Python ${{ matrix.check_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check_name: "Ruff Check"
            run: "uv run ruff check ."
          - check_name: "Ruff Format"
            run: "uv run ruff format --check ."
          - check_name: "Pylint"
            run: "uv run pylint --rcfile configs/pylint.toml apps/ packages/ tooling/"
          - check_name: "Mypy"
            run: "uv run mypy apps/ packages/ tooling/"
          - check_name: "Pyright"
            run: "uv run pyright apps/ packages/ tooling/"
          - check_name: "Quality Audit Config"
            run: "uv run python -m tooling.run_quality_audit --config-only"
          - check_name: "Tests"
            run: |-
              uv run pytest \
                --cov=apps \
                --cov=packages \
                --cov=tooling \
                --cov-report=term-missing \
                --cov-report=xml \
                --cov-report=html \
                -v
            upload_coverage: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run ${{ matrix.check_name }}
        run: ${{ matrix.run }}
        continue-on-error: ${{ env.IS_PROTECTED_BRANCH == 'false' }}

      - name: Upload coverage reports
        if: matrix.upload_coverage == 'true'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: ${{ env.IS_PROTECTED_BRANCH == 'false' }}

  security:
    name: Security ${{ matrix.check_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check_name: "Bandit"
            run: "uv run bandit -c pyproject.toml -r apps/ packages/ tooling/ -f json -o bandit-report.json"
          - check_name: "Safety"
            run: "uv run safety check --json"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run ${{ matrix.check_name }}
        run: ${{ matrix.run }}
        continue-on-error: ${{ env.IS_PROTECTED_BRANCH == 'false' }}

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
        continue-on-error: ${{ env.IS_PROTECTED_BRANCH == 'false' }} # Some hooks may fail on CI but are informative

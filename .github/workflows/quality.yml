name: Quality Checks

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.21"

jobs:
  dependency-check:
    name: Dependency Configuration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check dependency configuration
        run: uv run python tooling/check_dependencies.py

  python-quality:
    name: Python ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ["Linting", "Type Checking", "Tests"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff check
        if: matrix.check == 'Linting'
        run: uv run ruff check .

      - name: Ruff format check
        if: matrix.check == 'Linting'
        run: uv run ruff format --check .

      - name: Pylint
        if: matrix.check == 'Linting'
        run: uv run pylint apps/ packages/ tooling/

      - name: Mypy type check
        if: matrix.check == 'Type Checking'
        run: uv run mypy apps/ packages/ tooling/
        continue-on-error: true # Type checking is strict but may have false positives

      - name: Pyright type check
        if: matrix.check == 'Type Checking'
        run: uv run pyright apps/ packages/ tooling/
        continue-on-error: true # Type checking is strict but may have false positives

      - name: Run tests with coverage
        if: matrix.check == 'Tests'
        run: |
          uv run pytest \
            --cov=apps \
            --cov=packages \
            --cov=tooling \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            -v

      - name: Upload coverage reports
        if: matrix.check == 'Tests'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for Gitleaks to scan full history

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Bandit security scan
        run: uv run bandit -c pyproject.toml -r apps/ packages/ tooling/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Safety dependency check
        run: uv run safety check --json
        continue-on-error: true

      - name: Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
        continue-on-error: true # Some hooks may fail on CI but are informative

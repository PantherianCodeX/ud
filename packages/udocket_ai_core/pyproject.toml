[project]
name = "udocket-ai-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0.3,<2.0.0",
    "langsmith>=0.4.43,<0.5.0",
    "langfuse>=3.10.0,<4.0.0",
]

[tool.uv]
dev-dependencies = [
    # Dev dependencies inherited from root workspace
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/udocket_ai_core"]
include = ["src/udocket_ai_core/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["src/udocket_ai_core/py.typed"]

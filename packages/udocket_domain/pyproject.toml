[project]
name = "udocket-domain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.4,<3.0.0",
]

[tool.uv]
dev-dependencies = [
    # Dev dependencies inherited from root workspace
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/udocket_domain"]
include = ["src/udocket_domain/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["src/udocket_domain/py.typed"]

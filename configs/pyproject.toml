# Mypy configuration for uDocket - MAXIMUM STRICTNESS
# All strict mode options enabled

[tool.mypy]
# Python version
python_version = "3.12"

# === STRICTNESS FLAGS (ALL ENABLED) ===
# Enable all optional error checking flags
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Additional strictness beyond --strict
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

# Extra warnings
warn_incomplete_stub = true

# Error messages
show_error_context = true
show_column_numbers = true
show_error_codes = true
pretty = true
color_output = true
error_summary = true

# Miscellaneous strictness
strict_concatenate = true

# Import discovery
namespace_packages = true
explicit_package_bases = true

# Module search paths
mypy_path = ".:apps/api:packages/py-domain/src:packages/py-ai-core/src:packages/py-worker-core/src"

# Miscellaneous
extra_checks = true

# Plugins
plugins = ["pydantic.mypy"]

# Pydantic plugin configuration
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# Per-module options for test files
[[tool.mypy.overrides]]
module = ["tests.*", "*/tests/*"]
disallow_untyped_defs = false  # JUSTIFIED: Test functions use pytest fixtures with implicit types
disallow_untyped_decorators = false  # JUSTIFIED: pytest.mark decorators don't have type stubs

# Per-module options for third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "jose.*",
    "passlib.*",
    "structlog.*",
    "alembic.*",
    "celery.*",
    "rabbitmq.*",
    "fastapi.*",
    "uvicorn.*",
]
ignore_missing_imports = true  # JUSTIFIED: Third-party libraries without type stubs

# Alembic migration files
[[tool.mypy.overrides]]
module = "alembic.versions.*"
ignore_errors = true  # JUSTIFIED: Auto-generated migration files have dynamic patterns

# Pytest configuration for uDocket

[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests apps

# Async support
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --strict-config
    --cov=apps
    --cov=packages
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    smoke: Smoke tests

# Ignore patterns
norecursedirs =
    .git
    .venv
    __pycache__
    build
    dist
    *.egg-info

# Coverage options
[coverage:run]
source = apps,packages
omit =
    */tests/*
    */__pycache__/*
    */migrations/*
    */alembic/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

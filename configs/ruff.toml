# Ruff configuration for uDocket - MAXIMUM STRICTNESS
# All rules enabled except for explicit conflicts with project standards

# Line length
line-length = 120

# Target Python version
target-version = "py312"

# Exclude patterns
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "alembic/versions",
]

[lint]
# Enable ALL available rules
select = [
    "ALL",  # Enable all rules
]

# Minimal ignore list - only unavoidable conflicts
ignore = [
    "COM812",  # JUSTIFIED: Trailing comma conflicts with ruff formatter
    "ISC001",  # JUSTIFIED: Implicit string concatenation conflicts with formatter
    "D100",    # JUSTIFIED: Module docstrings enforced via per-file ignores where appropriate
    "D104",    # JUSTIFIED: Package docstrings enforced via per-file ignores where appropriate
    "S101",    # JUSTIFIED: Assert required by pytest testing framework
    "TRY003",  # JUSTIFIED: Detailed error messages improve debuggability
    "DJ",      # JUSTIFIED: Django rules not applicable to FastAPI project
    "FIX002",  # JUSTIFIED: TODOs tracked in issue system not inline
    "TD002",   # JUSTIFIED: TODO authors tracked in git history
    "TD003",   # JUSTIFIED: TODO issue links tracked externally
    "RUF012",  # JUSTIFIED: Pydantic model_config is intentionally mutable class attribute
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Preview features - enable cutting-edge rules
preview = true

[lint.per-file-ignores]
# Test files - minimal ignores for testing patterns
"tests/**/*.py" = [
    "PLR2004",   # JUSTIFIED: Magic values in tests are often test fixtures/expected values
    "D103",      # JUSTIFIED: Test functions are self-documenting via descriptive names
    "D102",      # JUSTIFIED: Pytest-based tests rely on descriptive naming, not docstrings
    "PLR6301",   # JUSTIFIED: Test methods don't need to be static for test organization
    "PLC2701",   # JUSTIFIED: Tests may import private helpers to achieve coverage
]
"**/tests/**/*.py" = [
    "PLR2004",   # JUSTIFIED: Magic values in tests are often test fixtures/expected values
    "D103",      # JUSTIFIED: Test functions are self-documenting via descriptive names
    "D102",      # JUSTIFIED: Pytest-based tests rely on descriptive naming, not docstrings
    "PLR6301",   # JUSTIFIED: Test methods don't need to be static for test organization
    "PLC2701",   # JUSTIFIED: Tests may import private helpers to achieve coverage
]
"**/test_*.py" = [
    "PLR2004",   # JUSTIFIED: Magic values in tests are often test fixtures/expected values
    "D103",      # JUSTIFIED: Test functions are self-documenting via descriptive names
    "D102",      # JUSTIFIED: Test files rely on expressive names rather than docstrings
    "PLR6301",   # JUSTIFIED: Test methods don't need to be static for test organization
    "INP001",    # JUSTIFIED: Test files don't need to be in packages
    "CPY001",    # JUSTIFIED: Test files don't need copyright headers
    "PLC0415",   # JUSTIFIED: Test methods may import in function body for isolation
    "PLC2701",   # JUSTIFIED: Tests may import private helpers to achieve coverage
]
# Conftest files
"**/conftest.py" = [
    "D103",      # JUSTIFIED: Pytest fixtures are self-documenting via descriptive names
    "ANN001",    # JUSTIFIED: Pytest fixtures use dependency injection
    "ANN201",    # JUSTIFIED: Pytest fixtures use dependency injection
    "DOC402",    # JUSTIFIED: Pytest fixtures yield values implicitly
    "DOC201",    # JUSTIFIED: Pytest fixtures return values implicitly
    "INP001",    # JUSTIFIED: Test directories don't need to be packages
]
# Tooling scripts
"tooling/*.py" = [
    "CPY001",    # JUSTIFIED: Internal tooling scripts don't need copyright
    "T201",      # JUSTIFIED: Tooling scripts need print for user output
    "DOC201",    # JUSTIFIED: Internal tooling docstrings can be simplified
    "D107",      # JUSTIFIED: Internal tooling __init__ methods don't need docstrings
    "C901",      # JUSTIFIED: Tooling scripts may have complex functions
    "PLR0912",   # JUSTIFIED: Tooling scripts may have many branches
    "PLR0915",   # JUSTIFIED: Tooling scripts may have many statements
    "PLR0914",   # JUSTIFIED: Tooling scripts may have many local variables
    "PLR1702",   # JUSTIFIED: Tooling scripts may have nested blocks
    "PLR2004",   # JUSTIFIED: Tooling scripts may use magic values for display limits
    "TRY300",    # JUSTIFIED: Tooling scripts may use try/except for control flow
    "E501",      # JUSTIFIED: Tooling scripts may have long lines for readability
    "INP001",    # JUSTIFIED: Tooling directory is not a package
    "PERF401",   # JUSTIFIED: Tooling scripts prioritize readability over micro-optimization
    "FBT001",    # JUSTIFIED: Tooling scripts use boolean flags for CLI clarity
    "FBT002",    # JUSTIFIED: Tooling scripts use boolean defaults for CLI options
]

# Migration files - auto-generated by Alembic
"**/alembic/versions/*.py" = [
    "D100",      # JUSTIFIED: Auto-generated migration files have standard format
    "D103",      # JUSTIFIED: Auto-generated functions (upgrade/downgrade) are self-documenting
    "INP001",    # JUSTIFIED: Migration directory is implicit namespace package
    "ANN001",    # JUSTIFIED: Auto-generated code doesn't have type annotations
    "ANN201",    # JUSTIFIED: Auto-generated code doesn't have type annotations
]
# Alembic env.py - configuration file
"**/alembic/env.py" = [
    "INP001",    # JUSTIFIED: Alembic directory is implicit namespace package
    "ANN001",    # JUSTIFIED: Alembic boilerplate functions
    "ANN201",    # JUSTIFIED: Alembic boilerplate functions
]

[lint.pydocstyle]
# Use Google docstring style
convention = "google"

[lint.flake8-copyright]
# Require copyright notices
notice-rgx = "(?i)Copyright \\(c\\) 202[0-9]"

[lint.flake8-quotes]
# Enforce double quotes
inline-quotes = "double"
docstring-quotes = "double"

[lint.isort]
# Import sorting configuration
known-first-party = [
    "udocket_api",
    "udocket_celery",
    "udocket_domain",
    "udocket_ai_core",
    "udocket_worker_core",
    "tooling",
]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[lint.pylint]
# Maximum arguments
max-args = 7
# Maximum branches
max-branches = 12
# Maximum returns
max-returns = 6
# Maximum statements
max-statements = 50

[format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces (4 spaces)
indent-style = "space"

# Line ending style
line-ending = "auto"

# Preview features
preview = true

# Docstring formatting
docstring-code-format = true
docstring-code-line-length = 88

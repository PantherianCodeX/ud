# Ruff configuration for uDocket - MAXIMUM STRICTNESS
# All rules enabled except for explicit conflicts with project standards

# Line length
line-length = 120

# Target Python version
target-version = "py312"

# Exclude patterns
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "alembic/versions",
]

[lint]
# Enable ALL available rules
select = [
    "ALL",  # Enable all rules
]

# Minimal ignore list - only unavoidable conflicts
ignore = [
    # Conflicts with other rules or project requirements
    "COM812",  # Conflicts with formatter
    "ISC001",  # Conflicts with formatter

    # Documentation - will be enforced but with appropriate exemptions
    "D100",    # Missing docstring in public module (enforced via per-file)
    "D104",    # Missing docstring in public package (enforced via per-file)

    # Type annotations - redundant with mypy/pyright
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls

    # Specific project needs
    "S101",    # Use of assert (pytest requires asserts in tests)
    "TRY003",  # Long exception messages (prefer detailed error messages)

    # Django/FastAPI specific (not applicable)
    "DJ",      # Django-specific rules

    # Overly restrictive for this project
    "FIX002",  # Line contains TODO (we track TODOs intentionally)
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Preview features - enable cutting-edge rules
preview = true

[lint.per-file-ignores]
# Test files
"tests/**/*.py" = [
    "S101",      # Allow assert in tests
    "PLR2004",   # Magic value comparison
    "ANN001",    # Missing type annotation for function argument
    "ANN201",    # Missing return type
    "D100",      # Missing docstring in public module
    "D103",      # Missing docstring in public function
]
"**/tests/**/*.py" = [
    "S101",
    "PLR2004",
    "ANN001",
    "ANN201",
    "D100",
    "D103",
]

# Migration files
"**/alembic/versions/*.py" = [
    "D100",      # Missing module docstring
    "D103",      # Missing function docstring
    "ANN001",    # Missing type annotation
    "ANN201",    # Missing return type
]

# Config files
"**/conftest.py" = [
    "D100",
]

[lint.pydocstyle]
# Use Google docstring style
convention = "google"

[lint.flake8-copyright]
# Require copyright notices
notice-rgx = "(?i)Copyright \\(c\\) 202[0-9]"

[lint.flake8-quotes]
# Enforce double quotes
inline-quotes = "double"
docstring-quotes = "double"

[lint.isort]
# Import sorting configuration
known-first-party = ["src", "py-domain", "udocket_py_ai_core", "udocket_py_worker_core"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[lint.pylint]
# Maximum arguments
max-args = 7
# Maximum branches
max-branches = 12
# Maximum returns
max-returns = 6
# Maximum statements
max-statements = 50

[format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces (4 spaces)
indent-style = "space"

# Line ending style
line-ending = "auto"

# Preview features
preview = true

# Docstring formatting
docstring-code-format = true
docstring-code-line-length = 88

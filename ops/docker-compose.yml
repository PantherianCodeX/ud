# Docker Compose for uDocket local development

version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: udocket-postgres
    environment:
      POSTGRES_USER: udocket
      POSTGRES_PASSWORD: udocket_dev_password
      POSTGRES_DB: udocket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udocket"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - udocket-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: udocket-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: udocket
      RABBITMQ_DEFAULT_PASS: udocket_dev_password
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - udocket-network

  redis:
    image: redis:7-alpine
    container_name: udocket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - udocket-network

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local

networks:
  udocket-network:
    driver: bridge
